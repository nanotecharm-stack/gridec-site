<svg xmlns="http://www.w3.org/2000/svg" viewBox="-86.603 -100 173.205 200" fill="currentColor" role="img" aria-label="mark">
  <!-- Инверсия: сплошной шестиугольник акцентного цвета лежит под гранями и выходит
       наружу только швом. Грани наследуют currentColor, акцент берётся из --acc
       (запасное значение — терракота на плашке). Шов d=9 => 18 единиц. -->
  <path style="fill:var(--acc,#D4714E)" d="M0 -100 L86.603 -50 L86.603 50 L0 100 L-86.603 50 L-86.603 -50 Z"/>
  <path d="M-86.603 -50 L-9 -94.804 L-9 -5.196 L-86.603 39.608 Z"/>
  <path d="M86.603 -50 L9 -94.804 L9 -5.196 L86.603 39.608 Z"/>
  <path d="M-86.603 60.392 L0 10.392 L86.603 60.392 L0 100 Z"/>
